<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b6bcb">
  <title>دخول الإدارة — IPv4 Academy</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f7fbff);color:#17324d}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(460px,100%);background:#fff;border:1px solid #d7e6f5;border-radius:22px;box-shadow:0 18px 50px rgba(22,68,110,.10);padding:32px}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .mark{width:52px;height:52px;border-radius:15px;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px}
    .brand h1{margin:0;color:#0b5dab;font-size:26px}.brand small{color:#70859a}
    h2{margin:0 0 8px;font-size:28px;color:#102d48}.lead{margin:0 0 22px;color:#6c7f91;line-height:1.8}
    .admin-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:#edf6ff;color:#0b6bcb;font-weight:800;font-size:13px;margin-bottom:18px}
    label{display:block;font-weight:800;margin:14px 0 7px}
    input{width:100%;height:50px;border:1px solid #cbdbea;border-radius:12px;padding:0 14px;font-size:16px;outline:none}
    input:focus{border-color:#0b6bcb;box-shadow:0 0 0 3px rgba(11,107,203,.10)}
    button{width:100%;height:52px;border:0;border-radius:12px;background:#0b6bcb;color:#fff;font-size:17px;font-weight:900;cursor:pointer;margin-top:20px}
    button:disabled{opacity:.65;cursor:wait}
    .msg{display:none;margin:14px 0;padding:12px 14px;border-radius:12px;background:#fff5f5;border-right:4px solid #d64545;color:#a42626;line-height:1.7}
    .msg.ok{display:block;background:#f0fbf4;border-color:#2d9a58;color:#206c3e}
    .msg.show{display:block}
    .footer{margin-top:20px;text-align:center;color:#7a8d9f;font-size:13px}
    .footer a{color:#0b6bcb;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="brand">
        <div class="mark">IP</div>
        <div><h1>IPv4 Academy</h1><small>بوابة الإدارة • V3.91 Admin Center</small></div>
      </div>
      <div class="admin-badge">🔐 دخول المدير فقط</div>
      <h2>تسجيل دخول الإدارة</h2>
      <p class="lead">هذه الصفحة مخصصة لمدير المنصة للوصول إلى لوحة الإدارة والطلاب والاختبارات والنتائج.</p>
      <div id="msg" class="msg"></div>
      <form id="admin-form" novalidate>
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="username" placeholder="adel.alrehili@gmail.com" required>
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required>
        <button id="submit" type="submit">دخول الإدارة</button>
      </form>
      <div class="footer"><a href="./index.html">العودة إلى منصة المتدربين</a></div>
    </section>
  </div>
  <script type="module" src="./assets/js/admin-login-v1.js?v=490"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="#fffdf8"/><defs><pattern id="lines" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 27.5H28" stroke="#dce9f6" stroke-width="1"/></pattern></defs><rect width="1400" height="1000" fill="url(#lines)"/><g font-family="Arial,sans-serif" fill="#102b58" text-anchor="middle"><rect x="455" y="28" width="490" height="90" rx="28" fill="#e7f2ff" stroke="#1769c2" stroke-width="4"/><text x="700" y="66" font-size="24">الخريطة الذهنية • الدرس الأول</text><text x="700" y="101" font-size="39" font-weight="700">أنظمة العدد</text><path d="M700 118V165M700 165L235 220M700 165L700 220M700 165L1165 220M700 165V570M700 570L235 625M700 570L700 625M700 570L1165 625" fill="none" stroke="#285da8" stroke-width="5" stroke-linecap="round"/><g><rect x="35" y="220" width="400" height="270" rx="24" fill="#f5eaff" stroke="#9864d9" stroke-width="3"/><text x="235" y="263" font-size="29" font-weight="700">ما نظام العدد؟</text><text x="235" y="311" font-size="22">طريقة لكتابة القيم برموز محددة</text><text x="235" y="350" font-size="22">قيمة الرقم تعتمد على موقعه</text><text x="235" y="389" font-size="22">وأُسّ النظام المستخدم</text><text x="235" y="442" font-size="23" font-weight="700">347 = 300 + 40 + 7</text><text x="235" y="470" font-size="18">مئات • عشرات • آحاد</text></g><g><rect x="500" y="220" width="400" height="270" rx="24" fill="#e9f8eb" stroke="#2f9b58" stroke-width="3"/><text x="700" y="263" font-size="29" font-weight="700">العشري Decimal</text><text x="700" y="315" font-size="23">الأساس: 10</text><text x="700" y="355" font-size="22">الرموز: 0 إلى 9</text><text x="700" y="398" font-size="22">أوزان الخانات من اليمين</text><text x="700" y="435" font-size="23" font-weight="700">1 • 10 • 100 • 1000</text><text x="700" y="468" font-size="18">نستخدمه في حياتنا اليومية</text></g><g><rect x="965" y="220" width="400" height="270" rx="24" fill="#fff1d9" stroke="#e39a23" stroke-width="3"/><text x="1165" y="263" font-size="29" font-weight="700">الثنائي Binary</text><text x="1165" y="315" font-size="23">الأساس: 2</text><text x="1165" y="355" font-size="22">الرموز: 0 و1 فقط</text><text x="1165" y="398" font-size="22">كل خانة تسمى Bit</text><text x="1165" y="435" font-size="23" font-weight="700">8 Bits = 1 Byte</text><text x="1165" y="468" font-size="18">أساسي في عمل الحواسيب</text></g><g><rect x="35" y="625" width="400" height="280" rx="24" fill="#e7f3ff" stroke="#287bd1" stroke-width="3"/><text x="235" y="668" font-size="27" font-weight="700">أوزان 8 بتات</text><text x="235" y="715" font-size="21">من اليسار إلى اليمين</text><text x="235" y="755" font-size="24" font-weight="700">128  64  32  16</text><text x="235" y="795" font-size="24" font-weight="700">8  4  2  1</text><text x="235" y="842" font-size="22">1011₂ = 8 + 2 + 1</text><text x="235" y="878" font-size="24" font-weight="700">= 11₁₀</text></g><g><rect x="500" y="625" width="400" height="280" rx="24" fill="#fff0f2" stroke="#d95366" stroke-width="3"/><text x="700" y="668" font-size="27" font-weight="700">السداسي عشري Hex</text><text x="700" y="715" font-size="23">الأساس: 16</text><text x="700" y="755" font-size="22">الرموز: 0–9 و A–F</text><text x="700" y="800" font-size="23" font-weight="700">A = 10 • F = 15</text><text x="700" y="845" font-size="21">اختصار لكتابة قيم ثنائية</text><text x="700" y="878" font-size="21">طويلة بصورة أسهل</text></g><g><rect x="965" y="625" width="400" height="280" rx="24" fill="#e9f7ff" stroke="#138bb0" stroke-width="3"/><text x="1165" y="668" font-size="27" font-weight="700">علاقتها بالشبكات</text><text x="1165" y="715" font-size="23">عنوان IPv4 = 32 بتًا</text><text x="1165" y="755" font-size="22">4 أجزاء، كل جزء 8 بتات</text><text x="1165" y="800" font-size="23" font-weight="700">192.168.10.25</text><text x="1165" y="842" font-size="20">يُعرض عشريًا، ويُمثّل ثنائيًا</text><text x="1165" y="878" font-size="20">التحويل بالتفصيل في الدرس الثاني</text></g><text x="700" y="960" font-size="23" font-weight="700" fill="#1769c2">افهم الأساس والرموز وقيمة الخانة قبل البدء بالتحويل</text></g></svg>
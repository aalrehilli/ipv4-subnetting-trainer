<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="#fffdf8"/><defs><pattern id="ruled" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31H32" stroke="#d8e7f7" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1500" fill="url(#ruled)"/><g font-family="Arial,sans-serif" fill="#142f5d" text-anchor="end"><rect x="55" y="35" width="1090" height="105" rx="24" fill="#e8f3ff" stroke="#287bd1" stroke-width="3"/><text x="1100" y="80" font-size="27">الدرس الأول • ملخص للمراجعة</text><text x="1100" y="122" font-size="43" font-weight="700">أنظمة العدد</text><rect x="70" y="170" width="1060" height="185" rx="20" fill="#fff" stroke="#7aa6d8" stroke-width="2"/><text x="1085" y="215" font-size="30" font-weight="700">١) ما نظام العدد؟</text><text x="1085" y="263" font-size="25">طريقة لكتابة القيم باستخدام رموز محددة.</text><text x="1085" y="304" font-size="25">قيمة كل رقم تعتمد على موقعه وأساس النظام.</text><rect x="70" y="385" width="1060" height="245" rx="20" fill="#f0faef" stroke="#3d9d61" stroke-width="3"/><text x="1085" y="430" font-size="30" font-weight="700">٢) النظام العشري Decimal</text><text x="1085" y="475" font-size="25">الأساس 10 • الرموز من 0 إلى 9</text><text x="1085" y="520" font-size="25">مثال: العدد 347</text><text x="1085" y="565" font-size="27" font-weight="700">347 = 3×100 + 4×10 + 7×1</text><text x="1085" y="605" font-size="27" font-weight="700">= 300 + 40 + 7</text><rect x="70" y="660" width="1060" height="330" rx="20" fill="#eef6ff" stroke="#287bd1" stroke-width="3"/><text x="1085" y="705" font-size="30" font-weight="700">٣) النظام الثنائي Binary</text><text x="1085" y="750" font-size="25">الأساس 2 • يستخدم 0 و1 فقط</text><text x="1085" y="795" font-size="25">كل خانة تسمى Bit، وثمانية بتات = Byte</text><text x="1085" y="845" font-size="25">أوزان 8 بت من اليسار إلى اليمين:</text><rect x="115" y="870" width="970" height="60" rx="12" fill="#fff3c9" stroke="#d7a72d" stroke-width="2"/><text x="600" y="910" text-anchor="middle" font-size="28" font-weight="700">128 | 64 | 32 | 16 | 8 | 4 | 2 | 1</text><text x="1085" y="962" font-size="26" font-weight="700">1011₂ = 8 + 2 + 1 = 11₁₀</text><rect x="70" y="1020" width="1060" height="235" rx="20" fill="#fff1e1" stroke="#e49a35" stroke-width="3"/><text x="1085" y="1065" font-size="30" font-weight="700">٤) السداسي عشري Hexadecimal</text><text x="1085" y="1110" font-size="25">الأساس 16 • الرموز 0–9 و A–F</text><text x="1085" y="1155" font-size="25">A=10، B=11، C=12، D=13، E=14، F=15</text><text x="1085" y="1200" font-size="25">يساعد على اختصار القيم الثنائية الطويلة.</text><rect x="70" y="1285" width="1060" height="165" rx="20" fill="#f6efff" stroke="#9365d7" stroke-width="3"/><text x="1085" y="1330" font-size="30" font-weight="700">٥) علاقتها بالشبكات</text><text x="1085" y="1375" font-size="25">IPv4 يتكون من 32 بتًا موزعة على أربعة أجزاء.</text><text x="1085" y="1417" font-size="25">كل جزء 8 بتات؛ والتحويل خطوة بخطوة في الدرس الثاني.</text></g></svg>